defaults:
  - model_config
  - _self_

wandb:
  project: "tiny-lm-pretraining"
  name: "pretrain-fineweb-100M"
  group: "pretrain"
  job_type: "train"

data:
  dataset_name: "HuggingFaceFW/fineweb-edu"
  data_dir: "./data/raw/fineweb"
  total_tokens: 2_000_000_000 

training:
  ckpt_dir: "./ckpts/pretrain"
  ckpt_every: 350
  resume_from: "auto"
  device_batch_size: 32
  gradient_accumulation_steps: 8
  mixed_precision: "bfloat16" 
  seed: 42
  val_every: 150
  # step calculation: 2B tokens / (512 batch_size * 2048 seq_len) ≈ 1907 total steps
  max_steps: 1907
  
optimizer:
  name: "AdamW"
  lr: 6.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  grad_clip: 1.0

scheduler:
  type: "cosine"
  # warmup steps = 10% of total steps
  warmup_steps: 190
  min_lr: 6.0e-5